name: update fish

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (free in a public repo)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render fish.svg
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.FISH_TOKEN || secrets.GITHUB_TOKEN }}
        run: python fish/render.py

      - name: Commit if the mood changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fish.svg
          git diff --cached --quiet || (git commit -m "fish: update mood" && git push)
